name: Desktop Auth CI

on:
  push:
    branches:
      - jqy/desktop-auth
  pull_request:
    branches:
      - jqy/desktop-auth

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          test -z "$(gofmt -l internal/service/desktop_auth_service.go internal/handler/desktop_auth_handler.go internal/handler/handler.go internal/handler/wire.go internal/server/routes/desktop_auth.go internal/server/router.go internal/service/wire.go)"
      - name: Compile affected packages
        run: go test ./internal/service ./internal/handler ./internal/server/routes
